name: ${COMPOSE_PROJECT_NAME:-fadex-helpdesk}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fadex_helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-fadex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fadex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Sem TZ o container roda em UTC, e como as entidades usam LocalDateTime (que nao
      # carrega fuso) os carimbos saem tres horas adiantados na tela. Fixar o fuso alinha o
      # relogio do backend ao do usuario. A correcao definitiva seria Instant/OffsetDateTime
      # ponta a ponta, com formatacao no navegador.
      TZ: ${TZ:-America/Fortaleza}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fadex_helpdesk}
      DB_USERNAME: ${POSTGRES_USER:-fadex}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fadex}
      JWT_SECRET: ${JWT_SECRET:-trocar-por-valor-local-com-pelo-menos-32-caracteres}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRATION_SECONDS: ${REFRESH_TOKEN_EXPIRATION_SECONDS:-604800}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      SSE_TIMEOUT_MS: ${SSE_TIMEOUT_MS:-1800000}
      SSE_HEARTBEAT_INTERVAL_MS: ${SSE_HEARTBEAT_INTERVAL_MS:-20000}
      SSE_RECONNECT_TIME_MS: ${SSE_RECONNECT_TIME_MS:-5000}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-5000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-5000}
      MAIL_FROM: ${MAIL_FROM:-no-reply@fadex.local}
      AI_TRIAGE_ENABLED: ${AI_TRIAGE_ENABLED:-true}
      AI_BASE_URL: http://ollama:11434
      AI_CLASSIFICATION_MODEL: ${AI_CLASSIFICATION_MODEL:-llama3.2:3b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-all-minilm}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-384}
      AI_WORKER_ENABLED: ${AI_WORKER_ENABLED:-true}
      AI_WORKER_BATCH_SIZE: ${AI_WORKER_BATCH_SIZE:-1}
      AI_WORKER_MAX_ATTEMPTS: ${AI_WORKER_MAX_ATTEMPTS:-3}
      AI_WORKER_INTERVAL_MILLIS: ${AI_WORKER_INTERVAL_MILLIS:-10000}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_SIMILARITY_THRESHOLD: ${AI_SIMILARITY_THRESHOLD:-0.75}
      AI_SIMILARITY_LIMIT: ${AI_SIMILARITY_LIMIT:-3}
      QUARTZ_THREAD_COUNT: ${QUARTZ_THREAD_COUNT:-1}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fadex Helpdesk}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}/api/v1}
        # Atalho para a caixa de e-mail da demonstracao. Cai junto com o Mailpit:
        # onde ele nao existe, a variavel fica vazia e o botao nao e renderizado.
        NEXT_PUBLIC_MAILPIT_URL: ${NEXT_PUBLIC_MAILPIT_URL:-http://localhost:${MAILPIT_UI_PORT:-8025}}
        # Amarrado ao seed: sem ele as contas oferecidas na tela nao existem.
        NEXT_PUBLIC_DEMO_LOGIN: ${APP_SEED_ENABLED:-true}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fadex Helpdesk}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}/api/v1}
      NEXT_PUBLIC_MAILPIT_URL: ${NEXT_PUBLIC_MAILPIT_URL:-http://localhost:${MAILPIT_UI_PORT:-8025}}
      NEXT_PUBLIC_DEMO_LOGIN: ${APP_SEED_ENABLED:-true}
      # O 'next start' escuta a porta de PORT. Fixando a mesma dos dois lados do
      # mapeamento, o endereco que o Next anuncia no log e o mesmo que funciona
      # no navegador — antes ele dizia sempre 3000, que era a porta de dentro do
      # container, e quem escolhia outra no wizard via o log discordar da URL.
      PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-models:
    image: ollama/ollama:latest
    restart: "no"
    profiles: ["modelos"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_CLASSIFICATION_MODEL: ${AI_CLASSIFICATION_MODEL:-llama3.2:3b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-all-minilm}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull $$AI_CLASSIFICATION_MODEL &&
       ollama pull $$AI_EMBEDDING_MODEL"

volumes:
  postgres-data:
  ollama-data:
