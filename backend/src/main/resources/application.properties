spring.application.name=helpdesk
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

security.jwt.secret=${JWT_SECRET:trocar-por-valor-local-com-pelo-menos-32-caracteres}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

notifications.sse.timeout=${SSE_TIMEOUT_MS:1800000}
notifications.sse.heartbeat-interval=${SSE_HEARTBEAT_INTERVAL_MS:20000}
notifications.sse.reconnect-time=${SSE_RECONNECT_TIME_MS:5000}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
app.mail.from=${MAIL_FROM:no-reply@fadex.local}
