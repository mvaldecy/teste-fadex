spring.application.name=helpdesk
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.placeholders.pgvector-extension=CREATE EXTENSION IF NOT EXISTS vector
spring.flyway.placeholders.ticket-embedding-column-type=vector(384)
spring.flyway.placeholders.ticket-embedding-index=CREATE INDEX idx_tickets_embedding_hnsw ON tickets USING hnsw (embedding vector_cosine_ops) WHERE embedding IS NOT NULL

spring.quartz.properties.org.quartz.threadPool.threadCount=${QUARTZ_THREAD_COUNT:1}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

security.jwt.secret=${JWT_SECRET:trocar-por-valor-local-com-pelo-menos-32-caracteres}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.refresh-token.expiration-seconds=${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

notifications.sse.timeout=${SSE_TIMEOUT_MS:1800000}
notifications.sse.heartbeat-interval=${SSE_HEARTBEAT_INTERVAL_MS:20000}
notifications.sse.reconnect-time=${SSE_RECONNECT_TIME_MS:5000}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
# Sem timeout explicito o JavaMail espera indefinidamente. Como o envio de e-mail divide o executor
# com o despacho SSE, um SMTP que aceita a conexao e nao responde travaria as notificacoes em tempo
# real sem erro nenhum.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}
app.mail.from=${MAIL_FROM:no-reply@fadex.local}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

app.ai.triage.enabled=${AI_TRIAGE_ENABLED:false}
app.ai.base-url=${AI_BASE_URL:http://localhost:11434}
app.ai.classification-model=${AI_CLASSIFICATION_MODEL:llama3.2:3b}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:all-minilm}
app.ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:384}
# Limiar medido sobre os pares reais da base, nao arbitrado. As distribuicoes se sobrepoem:
# duplicatas verdadeiras aparecem em 0,850, 0,764 e 0,672, e entre elas mora um par falso em
# 0,726. Nao ha corte limpo. 0,75 e o melhor ponto disponivel — pega as duas duplicatas mais
# claras e fica acima do falso. Descer mais captura o par de 0,672, mas traz o falso junto, e
# falso positivo aqui vira vinculo persistido que alguem desfaz a mao.
app.ai.similarity.threshold=${AI_SIMILARITY_THRESHOLD:0.75}
app.ai.similarity.limit=${AI_SIMILARITY_LIMIT:3}
app.ai.worker.enabled=${AI_WORKER_ENABLED:true}
# Lote e intervalo dimensionados pela fila do seed: sao 38 jobs numa instalacao nova (26 embeddings
# e 12 classificacoes), e com lote 1 a cada 10s a tela do avaliador so fica completa depois de mais
# de 6 minutos. Medido com lote 5 a cada 5s, com o Ollama local: 46 jobs drenaram em ~70s contados
# da subida do container. O pior caso de uma passada e 5 x request-timeout; o
# @DisallowConcurrentExecution do worker faz a execucao seguinte ser pulada em vez de concorrer.
# Atencao: o docker-compose.yml passa AI_WORKER_BATCH_SIZE e AI_WORKER_INTERVAL_MILLIS
# explicitamente, entao dentro do Docker vale o .env, nao este padrao.
app.ai.worker.batch-size=${AI_WORKER_BATCH_SIZE:5}
app.ai.worker.max-attempts=${AI_WORKER_MAX_ATTEMPTS:3}
# 60s, e nao 20s, por causa da promocao do llama3.2:3b a modelo padrao: uma classificacao curta
# levou 12,4s numa maquina de 12 vCPU. A do avaliador nao sera dessas, e o corte em 20s cairia
# calado na heuristica — o fallback e gracioso demais para reclamar. Prefiro esperar mais e
# entregar a classificacao que o modelo consegue dar.
app.ai.worker.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:60}
app.ai.worker.interval-millis=${AI_WORKER_INTERVAL_MILLIS:5000}
app.seed.enabled=${APP_SEED_ENABLED:true}
