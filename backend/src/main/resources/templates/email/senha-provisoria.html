<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: base(~{::section})}" lang="pt-br">
<body>
<section>
	<h2 th:replace="~{email/componentes :: titulo('Seu acesso ao Fadex Helpdesk')}">Titulo</h2>
	<p style="margin:0;">
		Ola, <span th:text="${destinatarioNome}">Usuario</span>. Sua conta foi criada. Use a senha
		provisoria abaixo no primeiro acesso — o sistema pede a troca em seguida.
	</p>
	<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;margin:18px 0;">
		<tr>
			<td align="center" style="padding:16px;font-family:'Courier New',Courier,monospace;font-size:20px;letter-spacing:2px;color:#0b3d64;background-color:#f8f9fb;border:1px dashed #0b3d64;border-radius:6px;" th:text="${senha}">
				senha-provisoria
			</td>
		</tr>
	</table>
	<table th:replace="~{email/componentes :: acao}"></table>
</section>
</body>
</html>
