<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="base(conteudo)" lang="pt-br">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title th:text="${titulo}">Fadex Helpdesk</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 12px;">
	<tr>
		<td align="center">
			<table role="presentation" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background-color:#ffffff;border:1px solid #e4e7eb;border-radius:8px;">
				<tr>
					<td style="background-color:#0b3d64;padding:18px 28px;color:#ffffff;font-size:17px;font-weight:bold;border-radius:8px 8px 0 0;">
						Fadex Helpdesk
					</td>
				</tr>
				<tr>
					<td style="padding:28px;font-size:15px;line-height:1.6;color:#1f2933;" th:insert="${conteudo}">
						conteudo
					</td>
				</tr>
				<tr>
					<td style="background-color:#f4f5f7;padding:16px 28px;font-size:12px;line-height:1.5;color:#616e7c;border-radius:0 0 8px 8px;">
						Mensagem automatica do Fadex Helpdesk. Nao responda a este e-mail.
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
