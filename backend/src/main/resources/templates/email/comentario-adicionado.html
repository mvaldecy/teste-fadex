<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: base(~{::section})}" lang="pt-br">
<body>
<section>
	<h2 th:replace="~{email/componentes :: titulo('Novo comentario no chamado')}">Titulo</h2>
	<p style="margin:0;">
		Ola, <span th:text="${destinatarioNome}">Destinatario</span>.
		<span th:text="${autorNome}">Autor</span> comentou no chamado abaixo.
	</p>
	<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;margin:18px 0;">
		<tr>
			<td style="padding:12px 16px;font-size:14px;line-height:1.6;color:#1f2933;background-color:#f8f9fb;border-left:4px solid #0b3d64;border-radius:0 6px 6px 0;white-space:pre-wrap;" th:text="${comentario}">
				Texto do comentario.
			</td>
		</tr>
	</table>
	<table th:replace="~{email/componentes :: chamado}"></table>
	<table th:replace="~{email/componentes :: acao}"></table>
</section>
</body>
</html>
