<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<body>
<h2 th:fragment="titulo(texto)" style="margin:0 0 16px 0;font-size:19px;line-height:1.3;color:#0b3d64;" th:text="${texto}">Titulo</h2>

<table th:fragment="chamado" role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background-color:#f8f9fb;border:1px solid #e4e7eb;border-radius:6px;margin:18px 0;">
	<tr>
		<td style="padding:14px 16px;font-size:14px;line-height:1.6;color:#1f2933;">
			<strong style="color:#0b3d64;" th:text="${chamadoTitulo}">Titulo do chamado</strong><br/>
			<span style="color:#616e7c;">Categoria:</span> <span th:text="${categoria}">Outros</span><br/>
			<span style="color:#616e7c;">Prioridade:</span> <span th:text="${prioridade}">Media</span><br/>
			<span style="color:#616e7c;">Status:</span> <span th:text="${status}">Aberto</span>
		</td>
	</tr>
</table>

<table th:fragment="acao" role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0 4px 0;">
	<tr>
		<td style="background-color:#0b3d64;border-radius:6px;">
			<a th:href="${acaoUrl}" th:text="${acaoRotulo}" style="display:inline-block;padding:11px 22px;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">Abrir chamado</a>
		</td>
	</tr>
</table>
</body>
</html>
