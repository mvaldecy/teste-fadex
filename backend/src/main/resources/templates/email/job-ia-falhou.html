<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: base(~{::section})}" lang="pt-br">
<body>
<section>

	<p style="margin:0;">
		Um job da triagem por IA falhou e precisa de atencao da operacao.
	</p>
	<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;margin:18px 0;">
		<tr>
			<td style="padding:12px 16px;font-size:13px;line-height:1.6;color:#1f2933;background-color:#fdf3f0;border-left:4px solid #b23c17;border-radius:0 6px 6px 0;white-space:pre-wrap;" th:text="${detalhe}">
				Detalhe da falha.
			</td>
		</tr>
	</table>
	<table th:replace="~{email/componentes :: acao}"></table>
</section>
</body>
</html>
