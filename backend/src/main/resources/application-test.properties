spring.datasource.url=jdbc:h2:mem:fadex_helpdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.placeholders.pgvector-extension=-- pgvector disabled in H2 tests
spring.flyway.placeholders.ticket-embedding-column-type=varchar(20000)
spring.flyway.placeholders.ticket-embedding-index=-- pgvector index disabled in H2 tests
spring.jpa.hibernate.ddl-auto=validate
app.seed.enabled=false
# O seed enfileira jobs de IA, e o worker do Quartz roda em thread propria durante o contexto de
# teste: sem desligar, ele processaria o seed no meio do teste de indicadores e mudaria a
# distribuicao de origem que o teste afirma. O worker tem cobertura propria, chamado direto.
app.ai.worker.enabled=false
